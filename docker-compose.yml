services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerforge
      POSTGRES_USER: ledgerforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerforge -d ledgerforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      fraud:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RATE_LIMIT_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      LEDGERFORGE_METRICS_TOKEN: ${LEDGERFORGE_METRICS_TOKEN:-}
      SPRING_PROFILES_ACTIVE: prod
      FRAUD_ENABLED: "true"
      # Mutual TLS to the fraud service: client certificate + the CA that signed the server certificate.
      FRAUD_SERVICE_URL: https://fraud:8090
      FRAUD_SSL_BUNDLE: fraudclient
      SPRING_SSL_BUNDLE_PEM_FRAUDCLIENT_KEYSTORE_CERTIFICATE: file:/certs/ledger-client.crt
      SPRING_SSL_BUNDLE_PEM_FRAUDCLIENT_KEYSTORE_PRIVATEKEY: file:/certs/ledger-client.key
      SPRING_SSL_BUNDLE_PEM_FRAUDCLIENT_TRUSTSTORE_CERTIFICATE: file:/certs/ca.crt
      LEDGERFORGE_OAUTH_SIGNING_KEY: ${LEDGERFORGE_OAUTH_SIGNING_KEY:-}
      FRAUD_SERVICE_TOKEN: ${FRAUD_SERVICE_TOKEN:?Set FRAUD_SERVICE_TOKEN in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledgerforge
      SPRING_DATASOURCE_USERNAME: ledgerforge
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LEDGERFORGE_ADMIN_TOKEN: ${LEDGERFORGE_ADMIN_TOKEN:?Set LEDGERFORGE_ADMIN_TOKEN in .env}
    volumes:
      - certs:/certs:ro
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Not published to the host: only the ledger API talks to it.

  # One-shot: creates a private CA and the mTLS certificates on first start (development only;
  # in production they come from your PKI or secrets manager).
  certs:
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache openssl >/dev/null && sh /scripts/generate-dev-certs.sh /certs && chmod 0644 /certs/*.crt /certs/*.key && rm -f /certs/ca.key"]
    volumes:
      - ./scripts:/scripts:ro
      - certs:/certs

  fraud:
    build: ./fraud-service
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      FRAUD_SERVICE_TOKEN: ${FRAUD_SERVICE_TOKEN}
      FRAUD_TLS_CERT: /certs/fraud-server.crt
      FRAUD_TLS_KEY: /certs/fraud-server.key
      FRAUD_TLS_CLIENT_CA: /certs/ca.crt
    volumes:
      - certs:/certs:ro
    healthcheck:
      # mTLS refuses anonymous HTTP checks, so the health check only confirms the port accepts connections.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8090), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the ledger API talks to it.

volumes:
  pgdata:
  certs:
