services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerforge
      POSTGRES_USER: ledgerforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerforge -d ledgerforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      certs:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      fraud:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RATE_LIMIT_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      LEDGERFORGE_METRICS_TOKEN: ${LEDGERFORGE_METRICS_TOKEN:-}
      SPRING_PROFILES_ACTIVE: prod
      FRAUD_ENABLED: "true"
      # Mutual TLS to the fraud service: client certificate + the CA that signed the server certificate.
      FRAUD_SERVICE_URL: https://fraud:8090
      FRAUD_SSL_BUNDLE: fraudclient
      SPRING_SSL_BUNDLE_PEM_FRAUDCLIENT_KEYSTORE_CERTIFICATE: file:/certs/api/ledger-client.crt
      SPRING_SSL_BUNDLE_PEM_FRAUDCLIENT_KEYSTORE_PRIVATEKEY: file:/certs/api/ledger-client.key
      SPRING_SSL_BUNDLE_PEM_FRAUDCLIENT_TRUSTSTORE_CERTIFICATE: file:/certs/api/ca.crt
      # Token-signing key as a file (created by the certs service); the prod profile refuses to start without one.
      LEDGERFORGE_OAUTH_SIGNING_KEY_FILE: /certs/api/oauth-signing.key
      FRAUD_FAIL_OPEN: "false"   # this stack has the fraud service; refuse transfers it can't score
      FRAUD_SERVICE_TOKEN: ${FRAUD_SERVICE_TOKEN:?Set FRAUD_SERVICE_TOKEN in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledgerforge
      SPRING_DATASOURCE_USERNAME: ledgerforge
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LEDGERFORGE_ADMIN_TOKEN: ${LEDGERFORGE_ADMIN_TOKEN:?Set LEDGERFORGE_ADMIN_TOKEN in .env}
      LEDGERFORGE_WEBHOOKS_ENCRYPTION_KEY: ${LEDGERFORGE_WEBHOOKS_ENCRYPTION_KEY:?Set LEDGERFORGE_WEBHOOKS_ENCRYPTION_KEY in .env}
    volumes:
      - certs:/certs:ro
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Not published to the host: only the ledger API talks to it.

  # One-shot: creates a private CA and the mTLS certificates on first start (development only;
  # in production they come from your PKI or secrets manager).
  certs:
    image: alpine:3.20
    # Each service gets its own folder, readable only by its own user (fraud: UID 10001, api: UID 10002),
    # so neither container can read the other's private key. The CA key is deleted after signing.
    command:
      - sh
      - -c
      - |
        set -e
        [ -f /certs/api/ledger-client.crt ] && { echo "certificates already exist"; exit 0; }
        apk add --no-cache openssl >/dev/null
        sh /scripts/generate-dev-certs.sh /tmp/gen
        mkdir -p /certs/fraud /certs/api
        cp /tmp/gen/fraud-server.crt /tmp/gen/fraud-server.key /tmp/gen/ca.crt /certs/fraud/
        cp /tmp/gen/ledger-client.crt /tmp/gen/ledger-client.key /tmp/gen/ca.crt /certs/api/
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /certs/api/oauth-signing.key 2>/dev/null
        rm -rf /tmp/gen
        chown -R 10001:10001 /certs/fraud && chown -R 10002:10002 /certs/api
        chmod 0500 /certs/fraud /certs/api
        chmod 0400 /certs/fraud/*.key /certs/api/*.key && chmod 0444 /certs/fraud/*.crt /certs/api/*.crt
    volumes:
      - ./scripts:/scripts:ro
      - certs:/certs

  fraud:
    build: ./fraud-service
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      FRAUD_SERVICE_TOKEN: ${FRAUD_SERVICE_TOKEN}
      FRAUD_TLS_CERT: /certs/fraud/fraud-server.crt
      FRAUD_TLS_KEY: /certs/fraud/fraud-server.key
      FRAUD_TLS_CLIENT_CA: /certs/fraud/ca.crt
    volumes:
      - certs:/certs:ro
    healthcheck:
      # mTLS refuses anonymous HTTP checks, so the health check only confirms the port accepts connections.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8090), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host: only the ledger API talks to it.

  # Developer dashboard: http://localhost:3000 (sign in with a tenant API key).
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on:
      - api
    environment:
      LEDGERFORGE_API_URL: http://api:8080
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?Set DASHBOARD_SESSION_SECRET in .env}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  certs:
