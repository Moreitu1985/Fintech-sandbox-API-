name: Load test

# Runs the real API (prod profile) against PostgreSQL 16 and drives it with k6, then checks that every
# tenant's books still balance. Results appear in the run summary and as an artifact.
on:
  workflow_dispatch:
    inputs:
      rate:
        description: Requests per second
        default: "200"
      duration:
        description: Duration (k6 format, e.g. 60s, 5m)
        default: "60s"
  push:
    branches: [main]
    paths: ["src/**", "pom.xml", "load/**", ".github/workflows/load-test.yml"]
  pull_request:
    paths: ["src/**", "pom.xml", "load/**", ".github/workflows/load-test.yml"]
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    name: k6 load test (transfers + integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerforge
          POSTGRES_USER: ledgerforge
          POSTGRES_PASSWORD: load-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerforge -d ledgerforge"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RATE: ${{ github.event.inputs.rate || '200' }}
      DURATION: ${{ github.event.inputs.duration || '60s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: ./mvnw -B -q -DskipTests package

      - name: Start the API (prod profile)
        run: |
          mkdir -p "$RUNNER_TEMP/secrets" "$RUNNER_TEMP/k6"
          chmod 0777 "$RUNNER_TEMP/k6"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/secrets/oauth.key" 2>/dev/null
          ADMIN_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$ADMIN_TOKEN"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          SPRING_PROFILES_ACTIVE=prod \
          SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/ledgerforge \
          SPRING_DATASOURCE_USERNAME=ledgerforge \
          SPRING_DATASOURCE_PASSWORD=load-test-only \
          LEDGERFORGE_ADMIN_TOKEN="$ADMIN_TOKEN" \
          LEDGERFORGE_OAUTH_SIGNING_KEY_FILE="$RUNNER_TEMP/secrets/oauth.key" \
          LEDGERFORGE_WEBHOOKS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
          LEDGERFORGE_RATELIMIT_CAPACITY=1000000 \
          LEDGERFORGE_RATELIMIT_REFILLPERSECOND=1000000 \
            nohup java -XX:MaxRAMPercentage=50 -jar target/ledgerforge-*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "API is up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::API did not become healthy"; tail -100 "$RUNNER_TEMP/api.log"; exit 1
        # Rate limits are raised here: this test measures the ledger, and the limiter has its own tests.

      - name: Run k6
        run: |
          docker run --rm --network host \
            -v "$PWD/load:/scripts:ro" -v "$RUNNER_TEMP/k6:/out" \
            -e BASE_URL=http://localhost:8080 -e ADMIN_TOKEN -e RATE -e DURATION -e SUMMARY_DIR=/out \
            grafana/k6:1.8.2 run --quiet /scripts/transfers.js

      - name: Publish results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/k6/summary.md" ]; then
            cat "$RUNNER_TEMP/k6/summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Runner: GitHub-hosted ubuntu-latest; API and PostgreSQL on the same machine." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No k6 summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -E "ERROR|Exception" "$RUNNER_TEMP/api.log" | head -20 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-test-results
          path: |
            ${{ runner.temp }}/k6/summary.json
            ${{ runner.temp }}/k6/summary.md
            ${{ runner.temp }}/api.log
          retention-days: 30
