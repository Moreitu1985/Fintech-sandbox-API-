name: Dashboard

on:
  pull_request:
    paths: ["dashboard/**", "sdk/typescript/**", "src/**", "pom.xml", ".github/workflows/dashboard.yml"]
  push:
    branches: [main]
    paths: ["dashboard/**", "sdk/typescript/**", "src/**", "pom.xml", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: Build, unit tests and browser tests against the real API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            dashboard/package-lock.json

      - name: Build the SDK
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install, type-check and unit-test the dashboard
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Build the dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Build and start the API (dev profile, so the test's local webhook receiver is allowed)
        run: |
          ./mvnw -B -q -DskipTests package
          ADMIN_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$ADMIN_TOKEN"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          LEDGERFORGE_ADMIN_TOKEN="$ADMIN_TOKEN" nohup java -jar target/ledgerforge-*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "API is up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::API did not become healthy"; tail -100 "$RUNNER_TEMP/api.log"; exit 1

      - name: Browser tests (Playwright, Chromium)
        working-directory: dashboard
        env:
          LEDGERFORGE_API_URL: http://localhost:8080
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          export DASHBOARD_SESSION_SECRET=$(openssl rand -base64 32)
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          retention-days: 14
      - name: API log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log"
