name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (supply-chain hardening):
# a moved or compromised tag cannot change what runs here. Dependabot keeps the pins current.

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests (Maven Wrapper)
        run: ./mvnw -B verify
      - name: Publish test summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          echo '| Test class | Tests | Failures | Errors | Skipped |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/TEST-*.xml; do
            [ -e "$f" ] || continue
            name=$(grep -o 'testsuite [^>]*name="[^"]*"' "$f" | head -1 | sed 's/.*name="\([^"]*\)".*/\1/' | sed 's/.*\.//')
            attr() { grep -o "<testsuite[^>]*" "$f" | head -1 | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*'; }
            echo "| $name | $(attr tests) | $(attr failures) | $(attr errors) | $(attr skipped) |" >> "$GITHUB_STEP_SUMMARY"
          done

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build image
        run: docker build -t ledgerforge:ci .
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ledgerforge:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
