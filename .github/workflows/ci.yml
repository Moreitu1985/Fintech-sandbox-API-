name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (supply-chain hardening):
# a moved or compromised tag cannot change what runs here. Dependabot keeps the pins current.

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and run all tests (Maven Wrapper)
        run: |
          set -o pipefail
          if ! ./mvnw -B verify 2>&1 | tee build.log; then
            # Surface the first Maven errors as annotations so failures are readable without the raw log.
            grep -E '^\[ERROR\]' build.log | grep -v -E '^\[ERROR\] *$|Re-run Maven|For more information|Help 1|^\[ERROR\] -> ' \
              | head -10 | cut -c1-400 | sed 's/^\[ERROR\] */::error::/'
            exit 1
          fi
      - name: Publish test summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          echo '| Test class | Tests | Failures | Errors | Skipped |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in target/surefire-reports/TEST-*.xml; do
            [ -e "$f" ] || continue
            name=$(grep -o 'testsuite [^>]*name="[^"]*"' "$f" | head -1 | sed 's/.*name="\([^"]*\)".*/\1/' | sed 's/.*\.//')
            attr() { grep -o "<testsuite[^>]*" "$f" | head -1 | grep -o " $1=\"[0-9]*\"" | grep -o '[0-9]*'; }
            echo "| $name | $(attr tests) | $(attr failures) | $(attr errors) | $(attr skipped) |" >> "$GITHUB_STEP_SUMMARY"
          done

  fraud-service:
    name: Fraud service tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fraud-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Train, then run API tests and model quality gates
        run: python -m pytest -v
      - name: Publish model metrics
        run: |
          python -m fraud_service.train model > /dev/null
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("model/metadata.json"))["metrics"]
          print("## Fraud model (held-out test set, synthetic data)")
          print(f"ROC AUC **{m['roc_auc']}** · PR AUC **{m['pr_auc']}**\n")
          print("| Threshold | Precision | Recall | False positive rate |")
          print("|---|---|---|---|")
          for name, key in [("REVIEW", "at_review_threshold"), ("BLOCK", "at_block_threshold"), ("Hand-written rule", "baseline_rule")]:
              r = m[key]
              print(f"| {name} | {r['precision']:.1%} | {r['recall']:.1%} | {r['false_positive_rate']:.2%} |")
          PY

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin, python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  container-scan:
    name: Container vulnerability scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ledger-api
            context: .
          - image: fraud-service
            context: fraud-service
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t ${{ matrix.image }}:ci ${{ matrix.context }}
      # 1) Report: every fixable CRITICAL/HIGH finding goes to the Security tab (SARIF).
      - name: Scan with Trivy (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload results to the GitHub Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}
      - name: Summarise findings
        if: always()
        run: |
          echo "## Container scan: ${{ matrix.image }} (fixable CRITICAL/HIGH)" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s trivy-results.sarif ]; then echo "No report produced." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          count=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          echo "Findings: **$count**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo '| Rule | Severity | Location |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.runs[] as $r | $r.results[] | . as $res
              | ($r.tool.driver.rules[] | select(.id == $res.ruleId) | .properties."security-severity" // "?") as $sev
              | "| \($res.ruleId) | \($sev) | \($res.locations[0].physicalLocation.artifactLocation.uri // "-") |"' \
              trivy-results.sarif | sort -u | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Container scan found $count fixable CRITICAL/HIGH vulnerabilities. See the job summary."
            # One annotation per vulnerable package: "package installed -> fixed (CVEs)".
            jq -r '[.runs[].results[] | .message.text as $t
                | { pkg: ($t | capture("Package: (?<v>[^\n]+)").v // "?"),
                    installed: ($t | capture("Installed Version: (?<v>[^\n]+)").v // "?"),
                    fixed: ($t | capture("Fixed Version: (?<v>[^\n]+)").v // "?"),
                    id: .ruleId }]
              | group_by(.pkg)[]
              | "::warning::\(.[0].pkg) \(.[0].installed) -> \(.[0].fixed) (\(map(.id) | unique | join(" ")))"' \
              trivy-results.sarif | head -10
          fi
      # 2) Gate: fail the build if anything fixable remains.
      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          test "$count" -eq 0
