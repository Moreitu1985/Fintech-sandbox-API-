name: TypeScript SDK

on:
  pull_request:
    paths: ["sdk/typescript/**", "src/**", "pom.xml", ".github/workflows/sdk.yml"]
  push:
    branches: [main]
    paths: ["sdk/typescript/**", "src/**", "pom.xml", ".github/workflows/sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # -eo pipefail: a failing command before `| tee` still fails the step
    working-directory: sdk/typescript

jobs:
  unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package works on Node ${{ matrix.node }} (ESM + CommonJS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:dist
      - name: Package contents
        if: matrix.node == '22'
        run: npm pack --dry-run 2>&1 | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End to end against the real API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build the API
        working-directory: .
        run: ./mvnw -B -q -DskipTests package
      - name: Start the API (dev profile, so the webhook receiver on localhost is allowed)
        working-directory: .
        run: |
          ADMIN_TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$ADMIN_TOKEN"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          LEDGERFORGE_ADMIN_TOKEN="$ADMIN_TOKEN" nohup java -jar target/ledgerforge-*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && { echo "API is up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "::error::API did not become healthy"; tail -100 "$RUNNER_TEMP/api.log"; exit 1
      - run: npm ci --no-audit --no-fund
      - name: SDK end to end
        env:
          BASE_URL: http://localhost:8080
        run: npm run e2e | tee -a "$GITHUB_STEP_SUMMARY"
      - name: API log on failure
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log"
