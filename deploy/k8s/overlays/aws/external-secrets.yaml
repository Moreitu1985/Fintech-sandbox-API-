# External Secrets Operator copies secrets from AWS Secrets Manager into Kubernetes Secrets, which the
# pods mount as files. Nothing secret is stored in Git. The operator signs in as this service account,
# whose IAM role (IRSA, created by Terraform) may read only this environment's secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledgerforge-secrets-reader
  annotations:
    eks.amazonaws.com/role-arn: SECRETS_READER_ROLE_ARN
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: ledgerforge-secrets-reader
---
# Keys are Spring property names (the API reads them as a config tree; see ledger-api.env).
# "PREFIX" is replaced with the environment's secret prefix, e.g. ledgerforge/prod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ledger-api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: spring.datasource.username
      remoteRef: { key: PREFIX/database, property: username }
    - secretKey: spring.datasource.password
      remoteRef: { key: PREFIX/database, property: password }
    - secretKey: spring.data.redis.password
      remoteRef: { key: PREFIX/redis, property: auth_token }
    - secretKey: ledgerforge.admin-token
      remoteRef: { key: PREFIX/app, property: admin_token }
    - secretKey: ledgerforge.metrics-token
      remoteRef: { key: PREFIX/app, property: metrics_token }
    - secretKey: ledgerforge.plugins.fraud.token
      remoteRef: { key: PREFIX/app, property: fraud_service_token }
    - secretKey: ledgerforge.webhooks.encryption-key
      remoteRef: { key: PREFIX/app, property: webhook_encryption_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ledger-api-oauth-signing-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ledger-api-oauth-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: signing.key
      remoteRef: { key: PREFIX/oauth-signing-key }
