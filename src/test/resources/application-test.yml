spring:
  datasource:
    url: jdbc:h2:mem:ledgerforge-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
    username: sa
    password: ""

ledgerforge:
  admin-token: test-admin-token-0123456789abcdef-0123
  rate-limit:
    capacity: 1000000
    refill-per-second: 1000000
  webhooks:
    # Fixed, so every cached test context (they share one H2 database) can read every endpoint's secret.
    encryption-key: dGVzdC1vbmx5LXdlYmhvb2sta2V5LTMyLWJ5dGVzISE=
    allow-insecure-targets: true
    poll-interval: 100ms
    retry-delays: [200ms, 200ms]
    disable-after-failed-deliveries: 2
  plugins:
    max-transfer:
      enabled: true
      amount: 10000000
