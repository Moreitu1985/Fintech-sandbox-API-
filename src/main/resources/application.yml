spring:
  application:
    name: ledgerforge
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  data:
    redis:
      repositories:
        enabled: false      # Redis holds rate-limit buckets only; all repositories are JPA
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms        # a slow limiter must not slow every request

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics   # prometheus/metrics need the metrics token
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}   # on only where Redis is actually used
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  # Traces are exported only when MANAGEMENT_OTLP_TRACING_ENDPOINT is set (e.g. http://otel-collector:4318/v1/traces).
  observations:
    key-values:
      application: ledgerforge

ledgerforge:
  # Required for /admin endpoints. Must be at least 32 characters. Leave empty to disable admin.
  admin-token: ${LEDGERFORGE_ADMIN_TOKEN:}
  # Read-only secret for Prometheus scraping (32+ characters, different from the admin token).
  metrics-token: ${LEDGERFORGE_METRICS_TOKEN:}
  rate-limit:
    capacity: 100            # burst size per API key (or per IP when unauthenticated)
    refill-per-second: 50
    store: ${RATE_LIMIT_STORE:memory}   # memory (per instance) or redis (shared by all instances)
  plugins:
    max-transfer:
      enabled: true
      amount: 5000000        # minor units: 50,000.00
    fraud:
      enabled: ${FRAUD_ENABLED:false}
      url: ${FRAUD_SERVICE_URL:http://localhost:8090}
      token: ${FRAUD_SERVICE_TOKEN:}
      fail-open: ${FRAUD_FAIL_OPEN:true}   # sandbox default; set false to refuse transfers when scoring is down
      connect-timeout: 500ms
      read-timeout: 1500ms
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ASSISTANT_MODEL:claude-haiku-5-5}
    max-tool-rounds: 5
    requests-per-minute: 10

logging:
  pattern:
    level: "%5p [rid=%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:ledgerforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""

---
# Public demo (e.g. Render free tier): in-memory database that resets on restart,
# Swagger UI on, and self-serve sandbox sign-up so visitors can try the API.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:ledgerforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
server:
  port: ${PORT:8080}
  # The platform's proxy terminates TLS; trust its X-Forwarded-* headers so per-IP rate
  # limiting sees the real client address and redirects use https.
  forward-headers-strategy: native
ledgerforge:
  sandbox:
    self-signup: true
  rate-limit:
    capacity: 60
    refill-per-second: 5

---
spring:
  config:
    activate:
      on-profile: prod
  # SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD come from the environment.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
